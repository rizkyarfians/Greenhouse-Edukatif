services:
  db:
    image: postgis/postgis:17-3.7
    environment:
      POSTGRES_DB: automotion
      POSTGRES_USER: automotion
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "automotion", "-d", "automotion"]
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  postgres_data:
