<!doctype html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#edf1e8">
  <title>Masuk · Automotion</title>
</head>
<body>
  <main class="sign-in">
    <figure class="login-preview model-stage">
      <img src="./greenhouse-preview.png" alt="Model 3D greenhouse melon dengan baris tanaman">
      <figcaption>Greenhouse melon · Pratinjau 3D</figcaption>
    </figure>
    <section aria-labelledby="login-title">
      <div class="brand"><span id="login-brand-icon" aria-hidden="true"></span>Automotion</div>
      <h1 id="login-title">Masuk ke Automotion</h1>
      <p>Ukur batas lahan dan coba simulasi pertanian.</p>
      <div class="actions">
        <button id="google-login" type="button" disabled>Masuk dengan Google</button>
        <a id="guest-entry" class="guest" href="./dashboard.html">Lanjut sebagai tamu</a>
      </div>
      <p id="login-status" class="status" role="status"></p>
    </section>
  </main>
  <script type="module" src="./src/login.js"></script>
</body>
</html>
